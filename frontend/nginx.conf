server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (BrowserRouter, per
    # App.tsx since Phase 6) -- any path not matching a real static
    # file must fall back to index.html so React Router can handle it
    # client-side, otherwise a direct visit to e.g.
    # /doctor/appointments/<uuid> would 404 at the nginx layer before
    # React ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}