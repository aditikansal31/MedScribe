# Production profile. Run alongside (not instead of) docker-compose.yml
# via: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# This layers production-specific overrides (backend/frontend services,
# removing pgAdmin, internal networking) on top of the existing base
# file's Postgres/Redis definitions, rather than duplicating them.

services:
  # pgAdmin explicitly removed for production -- it's a dev-only DB
  # browsing GUI with its own login, exposed on its own port; shipping
  # it to production is unnecessary attack surface for a tool nobody
  # needs in a real deployment. Overriding with `!reset null` removes
  # the service defined in the base compose file for this profile.
  pgadmin:
    !reset null

  postgres:
    ports: !override []  # no longer publish 5433 to the host -- only
                          # the backend container needs to reach Postgres,
                          # and it does so over the internal Docker
                          # network (service name "postgres"), not a
                          # published host port. Reduces exposed attack
                          # surface vs the dev profile's host-published port.

  redis:
    ports: !override []  # same reasoning -- backend reaches Redis via
                          # the internal network only in production.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medstt_v1_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # THE key switch flagged as deferred since Phase 2: backend now
      # runs INSIDE the Docker network, so it reaches Postgres/Redis by
      # SERVICE NAME, not localhost:5433/localhost:6380 (which only
      # worked when the backend ran directly on the host machine
      # outside Docker, as it has for the entirety of local development
      # up to this point).
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # Production security settings -- explicitly set here, not
      # relying on the dev-default values in config.py. Real values for
      # CORS_ALLOWED_ORIGINS must be supplied via .env for your actual
      # deployment domain; localhost is NOT a valid production origin.
      COOKIE_SECURE: "True"
    ports:
      - "8000:8000"
    volumes:
      # storage/ and logs/ persist on the HOST, not just inside the
      # container -- audio files, generated PDFs, and log files must
      # survive a container rebuild/restart, same principle as
      # Postgres/Redis's existing named volumes.
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medstt_v1_network
    # GPU passthrough -- REQUIRED, not optional, given MedASR/MedGemma's
    # hard CUDA dependency (Phases 9 and 13). Without this, the backend
    # container starts but every ML pipeline call fails the moment it
    # tries to reach the GPU. Requires the NVIDIA Container Toolkit
    # installed on the HOST (separate from this compose file -- see the
    # deployment runbook's prerequisites section).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at BUILD time (see frontend/Dockerfile's own comment
        # on why) -- must be the real, externally-reachable backend URL
        # for your deployment, not localhost, since this is what
        # browsers on OTHER machines will actually call.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: medstt_v1_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medstt_v1_network